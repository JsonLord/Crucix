<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HUGGING FACE — Space Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#020408;--panel:rgba(6,14,22,0.82);--glass:rgba(10,20,32,0.55);
  --border:rgba(100,240,200,0.12);--border-bright:rgba(100,240,200,0.3);
  --text:#e8f4f0;--dim:#6a8a82;--accent:#64f0c8;--accent2:#44ccff;
  --warn:#ffb84c;--danger:#ff5f63;--mono:'IBM Plex Mono',monospace;--sans:'Space Grotesk',sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden}
.bg-grid{position:fixed;inset:0;pointer-events:none;opacity:0;
  background-image:linear-gradient(rgba(100,240,200,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(100,240,200,0.03) 1px,transparent 1px);
  background-size:60px 60px;mask-image:radial-gradient(ellipse at 50% 30%,black 20%,transparent 70%)}
.bg-radial{position:fixed;inset:0;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(40,120,100,0.15),transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(40,100,180,0.08),transparent 40%)}
.scanline{position:fixed;inset:0;pointer-events:none;overflow:hidden;opacity:0}
.scanline::after{content:'';position:absolute;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,rgba(100,240,200,0.12),transparent);animation:scanMove 4s linear infinite}
@keyframes scanMove{0%{top:-2px}100%{top:100%}}

/* BOOT */
#boot{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg)}
.logo-ring{width:120px;height:120px;border:2px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;opacity:0}
.logo-ring::before{content:'';position:absolute;inset:-8px;border:1px solid var(--border);border-radius:50%;border-top-color:var(--accent);animation:spin 2s linear infinite}
.logo-ring::after{content:'';position:absolute;inset:-16px;border:1px solid rgba(100,240,200,0.06);border-radius:50%;border-bottom-color:rgba(100,240,200,0.15);animation:spin 3s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.logo-text{font-family:var(--mono);font-size:18px;font-weight:700;letter-spacing:0.2em;color:var(--accent)}
#bootLines{margin-top:32px;font-family:var(--mono);font-size:12px;color:var(--dim);text-align:left;line-height:2;min-width:340px;opacity:0}
#bootLines .ok{color:var(--accent)}
#bootLines .err{color:var(--danger)}
#bootFinal{margin-top:20px;font-family:var(--mono);font-size:14px;color:var(--accent);opacity:0;text-shadow:0 0 8px rgba(100,240,200,0.5)}

/* MAIN LAYOUT */
#main{position:relative;z-index:10;display:none;flex-direction:column;height:100vh;padding:16px;gap:16px;opacity:0}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 24px;background:var(--panel);border:1px solid var(--border);border-radius:8px;backdrop-filter:blur(10px)}
.tb-left{display:flex;gap:32px;align-items:center}
.tb-title{font-size:14px;font-weight:700;letter-spacing:0.1em;color:var(--text)}
.tb-stat{font-family:var(--mono);font-size:11px;color:var(--dim);display:flex;gap:8px;align-items:center}
.tb-val{color:var(--accent);font-weight:600}
.grid{display:flex;flex:1;gap:16px;min-height:0}
.col{display:flex;flex-direction:column;gap:16px;background:var(--panel);border:1px solid var(--border);border-radius:8px;backdrop-filter:blur(10px);padding:16px;overflow-y:auto}
#leftRail{flex:0 0 320px}
#centerCol{flex:1;display:flex;flex-direction:column;}

/* WIDGETS */
.wg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.wg-title{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:0.1em;color:var(--accent)}
.wg-count{font-family:var(--mono);font-size:10px;color:var(--dim)}

/* ITEMS */
.item{padding:12px;background:var(--glass);border:1px solid var(--border);border-radius:6px;margin-bottom:8px;font-size:13px;line-height:1.5;cursor:pointer;transition:border-color 0.2s}
.item:hover{border-color:var(--accent)}
.item-meta{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10px;color:var(--dim);margin-bottom:6px}
.item-src{color:var(--accent2);font-weight:600}
.item-urg{color:var(--warn)}
.item.running .item-src{color:#10b981}
.item.paused .item-src{color:#f59e0b}
.item.sleeping .item-src{color:#64748b}
.item.error .item-src{color:#ef4444}

/* TABS */
.profile-tab { padding:6px 12px; background:var(--glass); border:1px solid var(--border); border-radius:4px; font-family:var(--mono); font-size:11px; cursor:pointer; white-space:nowrap; transition:all 0.2s; color:var(--dim); }
.profile-tab.active { background:rgba(100,240,200,0.1); border-color:var(--accent); color:var(--accent); }
.profile-tab:hover { border-color:var(--accent); }

/* CONTROLS */
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn{background:rgba(100,240,200,0.1);color:var(--accent);border:1px solid var(--border);padding:4px 8px;border-radius:4px;font-family:var(--mono);font-size:10px;cursor:pointer;transition:all 0.2s}
.btn:hover{background:var(--accent);color:var(--bg)}
.btn-ai{background:rgba(68,204,255,0.1);color:var(--accent2);border-color:rgba(68,204,255,0.3)}
.btn-ai:hover{background:var(--accent2);color:var(--bg)}

/* LOGS & ANALYSIS */
#logsContainer{flex:1;background:#000;color:#0f0;font-family:var(--mono);font-size:12px;padding:16px;border-radius:6px;overflow-y:auto;border:1px solid var(--border);white-space:pre-wrap}
#analysisContainer{background:rgba(68,204,255,0.05);color:var(--text);font-size:13px;padding:16px;border-radius:6px;margin-top:16px;border:1px solid rgba(68,204,255,0.2);display:none;line-height:1.6}
</style>
</head>
<body>

<div id="boot">
  <div class="logo-ring"><span class="logo-text">HF_MONITOR</span></div>
  <div id="bootLines"></div>
  <div id="bootFinal">TERMINAL ACTIVE</div>
</div>

<div class="bg-radial" id="bgRadial"></div>
<div class="bg-grid" id="bgGrid"></div>
<div class="scanline" id="scanline"></div>

<div id="main">
  <div class="topbar" id="topbar"></div>
  <div class="grid">
    <div class="col" id="leftRail">
      <div class="wg-head">
        <div class="wg-title">HUGGING FACE SPACES</div>
        <div class="wg-count" id="spacesCount">0 TOTAL</div>
      </div>
      <div id="profileTabs" style="display:flex; gap:8px; margin-bottom:16px; overflow-x:auto;"></div>
      <div id="spacesList"></div>
    </div>
    <div class="col" id="centerCol">
      <div class="wg-head">
        <div class="wg-title" id="centerTitle">TELEMETRY STREAM</div>
        <div class="wg-count"><button class="btn" onclick="fetchState()">SYNC ALL</button></div>
      </div>
      <div id="logsContainer">Select a space to stream logs...</div>
      <div id="analysisContainer"></div>
    </div>
  </div>
</div>

<script>
// === BOOT SEQUENCE ===
const bootLines = [
  "Initializing Hugging Face Monitor...",
  "Loading authentication tokens...",
  "[OK] Tokens verified.",
  "Fetching configuration...",
  "Connecting to HF API...",
  "[OK] API connection established."
];

function runBoot(){
  const tl = gsap.timeline();
  tl.to('.logo-ring',{opacity:1,duration:1})
    .to('#bootLines',{opacity:1,duration:0.5},"+=0.5");

  const el = document.getElementById('bootLines');
  let delay = 1.5;
  bootLines.forEach((line, i) => {
    setTimeout(() => {
      const p = document.createElement('div');
      p.innerHTML = line.replace(/\[OK\]/,'<span class="ok">[OK]</span>').replace(/\[ERR\]/,'<span class="err">[ERR]</span>');
      el.appendChild(p);
      if(i === bootLines.length-1){
        setTimeout(()=>{
          gsap.to('#bootFinal',{opacity:1,duration:0.5});
          setTimeout(initApp, 1000);
        }, 500);
      }
    }, delay * 1000);
    delay += Math.random() * 0.4 + 0.1;
  });
}

function initApp(){
  gsap.to('#boot',{opacity:0,duration:1,onComplete:()=>{
    document.getElementById('boot').style.display='none';
    document.getElementById('main').style.display='flex';
    gsap.to(['.bg-grid','.bg-radial','.scanline','#main'],{opacity:1,duration:2,stagger:0.2});
    fetchState();
  }});
}

// === APP LOGIC ===
let state = null;
let activeStream = null;
let currentProfile = null;

async function fetchState() {
  try {
    const res = await fetch('/api/state');
    const data = await res.json();
    state = data;

    // Auto-select first profile if none selected
    if (!currentProfile && state.profiles && state.profiles.length > 0) {
      currentProfile = state.profiles[0];
    }

    renderTopbar();
    renderProfileTabs();
    renderSpaces();
  } catch (e) {
    console.error('Failed to fetch state', e);
  }
}

function switchProfile(profileName) {
  currentProfile = profileName;
  renderProfileTabs();
  renderSpaces();
}

function renderProfileTabs() {
  const tabsContainer = document.getElementById('profileTabs');
  tabsContainer.innerHTML = '';

  if (!state.profiles) return;

  state.profiles.forEach(p => {
    const btn = document.createElement('button');
    btn.className = `profile-tab ${p === currentProfile ? 'active' : ''}`;
    btn.innerText = p.toUpperCase();
    btn.onclick = () => switchProfile(p);
    tabsContainer.appendChild(btn);
  });
}

function renderTopbar(){
  const ts = new Date(state.lastRefreshed || Date.now());
  const d = ts.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}).toUpperCase();
  const t = ts.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});

  let totalSpaces = 0;
  if(state.spaces) {
    for(const p in state.spaces) totalSpaces += state.spaces[p].length;
  }

  document.getElementById('topbar').innerHTML=`
    <div class="tb-left">
      <div class="tb-title">HF_MONITOR</div>
      <div class="tb-stat">DATE <span class="tb-val">${d}</span></div>
      <div class="tb-stat">TIME <span class="tb-val">${t}</span></div>
    </div>
    <div class="tb-left">
      <div class="tb-stat">PROFILES <span class="tb-val">${state.profiles ? state.profiles.length : 0}</span></div>
      <div class="tb-stat">SPACES <span class="tb-val">${totalSpaces}</span></div>
      <div class="tb-stat">STATUS <span class="tb-val" style="color:#10b981">ONLINE</span></div>
    </div>
  `;
}

function renderSpaces(){
  const list = document.getElementById('spacesList');
  list.innerHTML = '';
  if(!state.spaces || !currentProfile) return;

  const spaces = state.spaces[currentProfile] || [];

  document.getElementById('spacesCount').innerText = `${spaces.length} IN PROFILE`;

  spaces.forEach(space => {
    const div = document.createElement('div');
    const statusClass = (space.status || 'unknown').toLowerCase().replace(' ','-');
    div.className = `item ${statusClass}`;
    div.innerHTML = `
      <div class="item-meta">
        <span class="item-src">${space.name}</span>
        <span>${space.hardware.toUpperCase()}</span>
      </div>
      <div style="font-size:11px;color:var(--text);margin-bottom:8px;">PROFILE: ${currentProfile.toUpperCase()}</div>
      <div style="font-size:11px;color:var(--text)">STATUS: <span style="font-weight:bold">${space.status.toUpperCase()}</span></div>
      <div class="btn-row">
        <button class="btn" onclick="startLogs('${currentProfile}','${space.name}','run')">RUN LOGS</button>
        <button class="btn" onclick="startLogs('${currentProfile}','${space.name}','build')">BUILD LOGS</button>
        <button class="btn btn-ai" onclick="analyzeLogs('${currentProfile}','${space.name}')">AI ANALYZE</button>
      </div>
    `;
    list.appendChild(div);
  });
}

function startLogs(profile, space, type) {
  if (activeStream) activeStream.close();

  const container = document.getElementById('logsContainer');
  document.getElementById('centerTitle').innerText = `${profile}/${space} - ${type.toUpperCase()} LOGS`;
  container.innerHTML = `[CONNECTING TO SSE] ${profile}/${space} ${type}...
`;

  activeStream = new EventSource(`/api/spaces/${profile}/${space}/logs/${type}`);

  activeStream.onmessage = (e) => {
    let msg = e.data;
    try {
        const p = JSON.parse(e.data);
        msg = p.message || p.error || JSON.stringify(p);
    } catch(err){}

    container.innerHTML += msg + '\n';
    container.scrollTop = container.scrollHeight;
  };

  activeStream.onerror = () => {
    container.innerHTML += `\n[STREAM ENDED]\n`;
    activeStream.close();
  };
}

async function analyzeLogs(profile, space) {
  const container = document.getElementById('analysisContainer');
  container.style.display = 'block';
  container.innerHTML = `Initializing AI Analysis for ${profile}/${space}...\nQuerying internal logs buffer...`;

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({profile, space})
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    container.innerHTML = `<strong style="color:var(--accent2);display:block;margin-bottom:8px">AI ANALYSIS COMPLETED</strong>` +
                          data.analysis.replace(/\n/g, '<br>');
  } catch (e) {
    container.innerHTML = `<span class="err">Analysis Failed: ${e.message}</span>`;
  }
}

// Start
runBoot();
</script>
</body>
</html>
