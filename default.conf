server {
    listen 7860;
    server_name _;

    location /mem0/ {
        proxy_pass http://127.0.0.1:7000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /mcp-mem0/mcp {
        proxy_pass http://127.0.0.1:8050/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/memories {
        proxy_pass http://127.0.0.1:8050/get_all_memories;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}