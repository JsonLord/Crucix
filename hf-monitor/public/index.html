<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hugging Face Space Monitor</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 20px; background: #0f172a; color: #f1f5f9; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .btn:hover { background: #2563eb; }
        .space-card { background: #1e293b; padding: 16px; margin-bottom: 16px; border-radius: 8px; border: 1px solid #334155; }
        .space-header { display: flex; justify-content: space-between; align-items: center; }
        .status { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; text-transform: uppercase; }
        .status.running { background: #10b981; color: white; }
        .status.paused { background: #f59e0b; color: white; }
        .status.sleeping { background: #64748b; color: white; }
        .status.building { background: #3b82f6; color: white; }
        .status.error { background: #ef4444; color: white; }
        .logs-container { background: #000; color: #0f0; padding: 10px; font-family: monospace; height: 300px; overflow-y: scroll; margin-top: 10px; border-radius: 4px; display: none; }
        .logs-container.active { display: block; }
        .tabs { display: flex; gap: 10px; margin-top: 10px; }
        .tab { background: #334155; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .tab.active { background: #3b82f6; }
        .ai-analysis { background: #334155; padding: 10px; margin-top: 10px; border-radius: 4px; display: none; }
        .ai-analysis.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Hugging Face Space Monitor</h1>
            <button class="btn" onclick="refreshAll()">Refresh All</button>
        </div>
        <div id="spaces-list">Loading spaces...</div>
    </div>

    <script>
        const API_URL = '/api';
        let activeStreams = {};

        async function fetchState() {
            try {
                const res = await fetch(`${API_URL}/state`);
                const data = await res.json();
                renderSpaces(data.spaces);
            } catch (e) {
                console.error('Failed to fetch state:', e);
            }
        }

        async function refreshAll() {
            document.getElementById('spaces-list').innerHTML = "Refreshing all spaces...";
            try {
                const res = await fetch(`${API_URL}/refresh`, { method: 'POST' });
                const data = await res.json();
                renderSpaces(data.data);
            } catch (e) {
                console.error('Failed to refresh:', e);
            }
        }

        async function refreshSpace(profile, space) {
            const btn = document.getElementById(`refresh-btn-${profile}-${space}`);
            if(btn) btn.innerText = "Refreshing...";
            try {
                await fetch(`${API_URL}/refresh/${profile}/${space}`, { method: 'POST' });
                await fetchState();
            } catch (e) {
                console.error('Failed to refresh space:', e);
            }
        }

        function toggleLogs(profile, space, type) {
            const containerId = `logs-${profile}-${space}`;
            const container = document.getElementById(containerId);

            // Close if open
            if (container.classList.contains('active') && container.dataset.type === type) {
                container.classList.remove('active');
                closeStream(`${profile}/${space}`);
                return;
            }

            container.classList.add('active');
            container.dataset.type = type;
            container.innerHTML = `Connecting to ${type} logs...\n`;

            // Highlight active tab
            document.querySelectorAll(`#tabs-${profile}-${space} .tab`).forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${type}-${profile}-${space}`).classList.add('active');

            startStream(profile, space, type, container);
        }

        function startStream(profile, space, type, container) {
            const spaceId = `${profile}/${space}`;
            closeStream(spaceId);

            const source = new EventSource(`${API_URL}/spaces/${profile}/${space}/logs/${type}`);
            activeStreams[spaceId] = source;

            source.onmessage = function(event) {
                let dataText = event.data;
                try {
                    const parsed = JSON.parse(event.data);
                    if (parsed.error) dataText = `[ERROR] ${parsed.error}`;
                    // HF format can be {type: 'log', message: '...'}
                    if (parsed.message) dataText = parsed.message;
                } catch(e) {}

                container.innerHTML += dataText + '\n';
                container.scrollTop = container.scrollHeight;
            };

            source.onerror = function(err) {
                console.error("SSE Error:", err);
                container.innerHTML += `\n[Stream Disconnected or Error]\n`;
                source.close();
            };
        }

        function closeStream(spaceId) {
            if (activeStreams[spaceId]) {
                activeStreams[spaceId].close();
                delete activeStreams[spaceId];
            }
        }

        async function analyzeLogs(profile, space) {
            const analysisDiv = document.getElementById(`analysis-${profile}-${space}`);
            analysisDiv.classList.add('active');
            analysisDiv.innerHTML = "Generating AI Analysis...";

            try {
                const res = await fetch(`${API_URL}/analyze`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ profile, space })
                });
                const data = await res.json();

                if (data.error) {
                    analysisDiv.innerHTML = `<strong>Error:</strong> ${data.error}`;
                } else {
                    analysisDiv.innerHTML = `<strong>AI Analysis:</strong><br>${data.analysis.replace(/\n/g, '<br>')}`;
                }
            } catch (e) {
                analysisDiv.innerHTML = `<strong>Failed to generate analysis:</strong> ${e.message}`;
            }
        }

        function renderSpaces(spacesMap) {
            const list = document.getElementById('spaces-list');
            list.innerHTML = '';

            for (const profile in spacesMap) {
                const profileDiv = document.createElement('div');
                profileDiv.innerHTML = `<h2>Profile: ${profile}</h2>`;
                list.appendChild(profileDiv);

                spacesMap[profile].forEach(space => {
                    const spaceSafeId = space.id.replace('/', '-');
                    const statusClass = (space.status || 'unknown').toLowerCase().replace(' ', '-');

                    const card = document.createElement('div');
                    card.className = 'space-card';
                    card.innerHTML = `
                        <div class="space-header">
                            <div>
                                <strong>${space.name}</strong>
                                <span class="status ${statusClass}">${space.status}</span>
                                <small>Hardware: ${space.hardware}</small>
                            </div>
                            <div>
                                <button class="btn" id="refresh-btn-${profile}-${space.name}" onclick="refreshSpace('${profile}', '${space.name}')">Refresh</button>
                            </div>
                        </div>
                        <div class="tabs" id="tabs-${profile}-${space.name}">
                            <div class="tab" id="tab-run-${profile}-${space.name}" onclick="toggleLogs('${profile}', '${space.name}', 'run')">Run Logs</div>
                            <div class="tab" id="tab-build-${profile}-${space.name}" onclick="toggleLogs('${profile}', '${space.name}', 'build')">Build Logs</div>
                            <button class="btn" style="background: #8b5cf6;" onclick="analyzeLogs('${profile}', '${space.name}')">AI Analysis</button>
                        </div>
                        <div class="logs-container" id="logs-${profile}-${space.name}"></div>
                        <div class="ai-analysis" id="analysis-${profile}-${space.name}"></div>
                    `;
                    list.appendChild(card);
                });
            }
            if (Object.keys(spacesMap).length === 0) {
                list.innerHTML = "No spaces found or loaded. Configure HF_PROFILES in .env and click Refresh All.";
            }
        }

        // Init
        fetchState();
    </script>
</body>
</html>
